<!DOCTYPE html>
<html lang="pt-br
">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        .formulario {
            text-align: center;
            border-radius: 10px;
            box-shadow: 1px 1px 1px rgba(0, 0, 0, 0.366);
            font-family: Arial, Helvetica, sans-serif;
        }

        #agrupar {
            text-align: center;
            border-radius: 10px;
            box-shadow: 1px 1px 1px rgba(0, 0, 0, 0.763);
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadadtro.php" method="get" autocapitalize="on">
        <fieldset id="agrupar">
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" class="formulario" maxlength="30" minlength="5" required>
            </p>
            <p>
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" class="formulario" autocomplete="email">
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" class="formulario" autocapitalize="tel"
                    pattern="^\(\d{2}\)\d{4,5}-\d{4}$" placeholder="(xx)xxxxx-xxxx" required>
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>

</html>
