<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        form {
            text-align: center;
            border-radius: 10px;
            box-shadow: 3px 1px 2px rgba(0, 0, 0, 0.366);
            font-family: Arial, Helvetica, sans-serif;
        }

        .formulario{
            text-align: center;
            border-radius: 10px;
            box-shadow: 1px 1px 1px rgba(0, 0, 0, 0.366);
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required maxlength="30" autocomplete="name"
                placeholder="Nome Complete" class="formulario">
        </p>
        <p>
            <label for="imedia">Média:</label>
            <input type="number" name="media" id="imedia" placeholder="0 à 10" min="0" max="10" step="0.1" required class="formulario">
        </p>
        <p>
            <label for="imes">Período Letivo:</label>
            <input type="month" name="mes" id="imes" value="2025-10" class="formulario" required>
        </p>
            <p>
            <label for="idia">Dia da Prova:</label>
            <input type="date" name="dia" id="idia" class="formulario" required>
        </p>
        <p>
            <label for="ihora">Horário da Prova</label>
            <input type="time" name="hora" id="ihora" class="formulario" required >
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    
    </form>
</body>

</html>
